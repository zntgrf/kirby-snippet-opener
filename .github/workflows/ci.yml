name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Toolchain node, not the runtime node: the extension host of
      # VS Code ^1.94 runs Node 20 (see @types/node), but npm 12 needs
      # ^22.22.2 || ^24.15.0 || >=26.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
