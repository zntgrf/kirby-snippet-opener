# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"

    # The project has no runtime dependencies, so everything dependabot can
    # touch belongs in one batch. The limit keeps it at one open PR: instead
    # of opening a second one, dependabot updates the existing branch.
    open-pull-requests-limit: 1

    groups:
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        patterns: ["*"]
      dev-dependencies-security:
        applies-to: security-updates
        dependency-type: "development"
        patterns: ["*"]

    ignore:
      # typescript majors break the @typescript-eslint peer range; bump by hand
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # tied to engines.vscode, not to what is on the registry
      - dependency-name: "@types/vscode"
      # tied to the node version of the extension host
      - dependency-name: "@types/node"

    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"

    # Same deal as npm: one batched PR, not one per action.
    open-pull-requests-limit: 1

    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

    commit-message:
      prefix: "ci"
